name: Release

on:
  push:
    tags:
    - 'v2*'

jobs:
  release:
    name: Build and Release Resume
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Typst
      run: |
        curl -sL "https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
        tar -xJf /tmp/typst.tar.xz -C /tmp/
        sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

    - name: Install Atkinson Hyperlegible Font
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq fonts-atkinson-hyperlegible 2>/dev/null || \
          (curl -sL "https://github.com/googlefonts/atkinson-hyperlegible/releases/latest/download/Atkinson-Hyperlegible-Font.zip" -o /tmp/atkinson.zip && \
           sudo unzip -o /tmp/atkinson.zip -d /usr/local/share/fonts/atkinson && \
           sudo fc-cache -fv)

    - name: Compile Resume
      run: |
        mkdir -p out
        DATE=$(date +%Y-%-m-%-d)
        typst compile resume.typ "out/JayLooneyResume_${DATE}.pdf"
        echo "DATE=${DATE}" >> "$GITHUB_ENV"

    - name: Extract Version from Tag
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Resume ${{ steps.version.outputs.version }}
        body: |
          Jay Looney Resume — Release ${{ steps.version.outputs.version }}

          Compiled with Typst using Atkinson Hyperlegible typeface.
        files: out/JayLooneyResume_*.pdf
        generate_release_notes: false
